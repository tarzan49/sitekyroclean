  <!-- Critical CSS & Preloads for LCP optimization -->

  <!-- Critical inline CSS for faster FCP -->
  <style>
    /* Prevent layout shift */
    html, body { margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    /* Critical loading state */
    .loading-skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
  
  <!-- Google tag (gtag.js) - GA4 + Google Ads -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // GDPR Consent Mode v2 — default denied until user accepts
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    // Advanced consent mode (owner decision, 26 Sep 2026): gtag.js is loaded by
    // consent.ts on every visit with these defaults, so Google gets cookieless
    // pings until the visitor accepts. The Meta Pixel still waits for acceptance.
  </script>
