# Publica o site (Worker kyro-site) a cada push para master. Desde 16/11/2026
# o site é um Worker e não um Cloudflare Pages (limite de 20.000 ficheiros).
name: Publicar site
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: deploy-site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_ADS_LEAD_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_LEAD_CONVERSION_LABEL }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
      - name: Travar se faltar o Supabase
        run: "! grep -rq placeholder.supabase dist/assets"
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
